version: "2"

run:
  timeout: 10m

linters:
  default: standard
  enable:
    - copyloopvar
    - errorlint
    - intrange
    - makezero
    - misspell
    - nosprintfhostport
    - recvcheck
    - unparam
    - wastedassign
  exclusions:
    generated: lax
    paths:
      - web/distroface/node_modules
    rules:
      # Close, Fprint, WriteString and Remove are best effort
      - linters:
          - errcheck
        text: 'Error return value of `.*\.Close` is not checked'
      - linters:
          - errcheck
        text: 'Error return value of `(fmt\.Fprint(f|ln)?|io\.WriteString|os\.Remove(All)?)` is not checked'

formatters:
  enable:
    - gofmt
