syntax = "proto3";

package distroface.v1;

import "distroface/v1/pagination.proto";
import "distroface/v1/types.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/nickheyer/distroface/pkg/proto/distroface/v1;distrofacev1";

// GitService manages git repositories, their settings, links, stars, and collaborators.
// Clone, fetch, and push themselves are plain git over https and ssh.
service GitService {
  // CreateGitRepository creates an empty, initialized, mirrored, or forked repository.
  rpc CreateGitRepository(CreateGitRepositoryRequest) returns (CreateGitRepositoryResponse) {}
  // GetGitRepository returns one repository with the caller's access per unit.
  rpc GetGitRepository(GetGitRepositoryRequest) returns (GetGitRepositoryResponse) {}
  // ListGitRepositories returns repositories visible to the caller.
  rpc ListGitRepositories(ListGitRepositoriesRequest) returns (ListGitRepositoriesResponse) {}
  // SearchGitRepositories searches name, description, and topics across visible repositories.
  rpc SearchGitRepositories(SearchGitRepositoriesRequest) returns (SearchGitRepositoriesResponse) {}
  // UpdateGitRepository changes metadata, units, merge settings, and mirror configuration.
  rpc UpdateGitRepository(UpdateGitRepositoryRequest) returns (UpdateGitRepositoryResponse) {}
  // DeleteGitRepository removes the repository and optionally its linked packages.
  rpc DeleteGitRepository(DeleteGitRepositoryRequest) returns (DeleteGitRepositoryResponse) {}
  // MoveGitRepository renames or transfers a repository, linked packages follow.
  rpc MoveGitRepository(MoveGitRepositoryRequest) returns (MoveGitRepositoryResponse) {}
  // AcceptTransfer completes a pending transfer into the caller's namespace.
  rpc AcceptTransfer(AcceptTransferRequest) returns (AcceptTransferResponse) {}
  // RejectTransfer cancels a pending transfer.
  rpc RejectTransfer(RejectTransferRequest) returns (RejectTransferResponse) {}
  // ArchiveGitRepository makes a repository read only.
  rpc ArchiveGitRepository(ArchiveGitRepositoryRequest) returns (ArchiveGitRepositoryResponse) {}
  // UnarchiveGitRepository restores writes.
  rpc UnarchiveGitRepository(UnarchiveGitRepositoryRequest) returns (UnarchiveGitRepositoryResponse) {}
  // ForkGitRepository copies a repository into another namespace.
  rpc ForkGitRepository(ForkGitRepositoryRequest) returns (ForkGitRepositoryResponse) {}
  // SyncFork fast forwards the fork's default branch from its parent.
  rpc SyncFork(SyncForkRequest) returns (SyncForkResponse) {}
  // ListForks returns the forks of a repository.
  rpc ListForks(ListForksRequest) returns (ListForksResponse) {}
  // UseTemplate creates a repository from a template repository.
  rpc UseTemplate(UseTemplateRequest) returns (UseTemplateResponse) {}
  // SetTopics replaces the topic list.
  rpc SetTopics(SetTopicsRequest) returns (SetTopicsResponse) {}
  // StarGitRepository stars a repository for the current user.
  rpc StarGitRepository(StarGitRepositoryRequest) returns (StarGitRepositoryResponse) {}
  // UnstarGitRepository removes the current user's star.
  rpc UnstarGitRepository(UnstarGitRepositoryRequest) returns (UnstarGitRepositoryResponse) {}
  // ListStarredGitRepositories returns the current user's starred repositories.
  rpc ListStarredGitRepositories(ListStarredGitRepositoriesRequest) returns (ListStarredGitRepositoriesResponse) {}
  // WatchGitRepository sets the caller's watch mode.
  rpc WatchGitRepository(WatchGitRepositoryRequest) returns (WatchGitRepositoryResponse) {}
  // SyncGitRepository starts an immediate mirror sync in the background.
  rpc SyncGitRepository(SyncGitRepositoryRequest) returns (SyncGitRepositoryResponse) {}
  // StopGitRepositorySync cancels the running mirror sync, if any.
  rpc StopGitRepositorySync(StopGitRepositorySyncRequest) returns (StopGitRepositorySyncResponse) {}
  // GenerateMirrorKey creates the ssh key pair used for ssh upstreams.
  rpc GenerateMirrorKey(GenerateMirrorKeyRequest) returns (GenerateMirrorKeyResponse) {}
  // ListPushMirrors returns the push mirrors of a repository.
  rpc ListPushMirrors(ListPushMirrorsRequest) returns (ListPushMirrorsResponse) {}
  // CreatePushMirror adds a remote the repository pushes to.
  rpc CreatePushMirror(CreatePushMirrorRequest) returns (CreatePushMirrorResponse) {}
  // UpdatePushMirror changes a push mirror.
  rpc UpdatePushMirror(UpdatePushMirrorRequest) returns (UpdatePushMirrorResponse) {}
  // DeletePushMirror removes a push mirror.
  rpc DeletePushMirror(DeletePushMirrorRequest) returns (DeletePushMirrorResponse) {}
  // SyncPushMirror pushes to one mirror now.
  rpc SyncPushMirror(SyncPushMirrorRequest) returns (SyncPushMirrorResponse) {}
  // ListLinkedRepositories returns the image and artifact repositories linked to a repository.
  rpc ListLinkedRepositories(ListLinkedRepositoriesRequest) returns (ListLinkedRepositoriesResponse) {}
  // LinkRepository links an image or artifact repository in the same namespace.
  rpc LinkRepository(LinkRepositoryRequest) returns (LinkRepositoryResponse) {}
  // UnlinkRepository removes a package link.
  rpc UnlinkRepository(UnlinkRepositoryRequest) returns (UnlinkRepositoryResponse) {}
  // ListCollaborators returns per repository collaborators.
  rpc ListCollaborators(ListCollaboratorsRequest) returns (ListCollaboratorsResponse) {}
  // AddCollaborator invites a user with a permission level.
  rpc AddCollaborator(AddCollaboratorRequest) returns (AddCollaboratorResponse) {}
  // UpdateCollaborator changes a collaborator's permission.
  rpc UpdateCollaborator(UpdateCollaboratorRequest) returns (UpdateCollaboratorResponse) {}
  // RemoveCollaborator removes a collaborator.
  rpc RemoveCollaborator(RemoveCollaboratorRequest) returns (RemoveCollaboratorResponse) {}
  // AcceptCollaboration accepts a pending collaborator invitation.
  rpc AcceptCollaboration(AcceptCollaborationRequest) returns (AcceptCollaborationResponse) {}
  // GetRepositoryActivity returns weekly commit counts for the last year.
  rpc GetRepositoryActivity(GetRepositoryActivityRequest) returns (GetRepositoryActivityResponse) {}
  // GetRepositoryLanguages returns bytes per detected language on the default branch.
  rpc GetRepositoryLanguages(GetRepositoryLanguagesRequest) returns (GetRepositoryLanguagesResponse) {}
  // ListContributors aggregates commits by author.
  rpc ListContributors(ListContributorsRequest) returns (ListContributorsResponse) {}
  // RunMaintenance repacks and prunes one repository now.
  rpc RunMaintenance(RunMaintenanceRequest) returns (RunMaintenanceResponse) {}
  // ListTransfers returns pending transfers addressed to the caller.
  rpc ListTransfers(ListTransfersRequest) returns (ListTransfersResponse) {}
}

// GitRefService manages branches, tags, and their protection rules.
service GitRefService {
  // ListBranches returns branches with their tip commit and distance from the default branch.
  rpc ListBranches(ListBranchesRequest) returns (ListBranchesResponse) {}
  // GetBranch returns one branch.
  rpc GetBranch(GetBranchRequest) returns (GetBranchResponse) {}
  // CreateBranch creates a branch from a ref or sha.
  rpc CreateBranch(CreateBranchRequest) returns (CreateBranchResponse) {}
  // DeleteBranch deletes a branch.
  rpc DeleteBranch(DeleteBranchRequest) returns (DeleteBranchResponse) {}
  // RenameBranch renames a branch, retargeting pull requests and the default branch.
  rpc RenameBranch(RenameBranchRequest) returns (RenameBranchResponse) {}
  // ListGitTags returns tags in natural version order, newest first.
  rpc ListGitTags(ListGitTagsRequest) returns (ListGitTagsResponse) {}
  // GetTag returns one tag.
  rpc GetTag(GetTagRequest) returns (GetTagResponse) {}
  // CreateTag creates a lightweight or annotated tag.
  rpc CreateTag(CreateTagRequest) returns (CreateTagResponse) {}
  // DeleteTag deletes a tag.
  rpc DeleteTag(DeleteTagRequest) returns (DeleteTagResponse) {}
  // SetBranchProtection creates or replaces a protection rule.
  rpc SetBranchProtection(SetBranchProtectionRequest) returns (SetBranchProtectionResponse) {}
  // ListBranchProtections returns the protection rules of a repository.
  rpc ListBranchProtections(ListBranchProtectionsRequest) returns (ListBranchProtectionsResponse) {}
  // DeleteBranchProtection removes a protection rule.
  rpc DeleteBranchProtection(DeleteBranchProtectionRequest) returns (DeleteBranchProtectionResponse) {}
  // SetTagProtection creates or replaces a tag protection rule.
  rpc SetTagProtection(SetTagProtectionRequest) returns (SetTagProtectionResponse) {}
  // ListTagProtections returns the tag protection rules of a repository.
  rpc ListTagProtections(ListTagProtectionsRequest) returns (ListTagProtectionsResponse) {}
  // DeleteTagProtection removes a tag protection rule.
  rpc DeleteTagProtection(DeleteTagProtectionRequest) returns (DeleteTagProtectionResponse) {}
}

// GitFileService reads trees, blobs, commits, diffs, and blame, and writes files from the web.
service GitFileService {
  // GetTree lists one directory of a tree.
  rpc GetTree(GetTreeRequest) returns (GetTreeResponse) {}
  // GetBlob returns one file with content inline up to one megabyte.
  rpc GetBlob(GetBlobRequest) returns (GetBlobResponse) {}
  // GetReadme finds and returns the readme for a directory.
  rpc GetReadme(GetReadmeRequest) returns (GetReadmeResponse) {}
  // ListCommits pages the history of a ref, optionally filtered by path or author.
  rpc ListCommits(ListCommitsRequest) returns (ListCommitsResponse) {}
  // GetCommit returns one commit with stats, verification, and statuses.
  rpc GetCommit(GetCommitRequest) returns (GetCommitResponse) {}
  // GetCommitDiff pages the files one commit changed against a parent, hunks excluded.
  rpc GetCommitDiff(GetCommitDiffRequest) returns (GetCommitDiffResponse) {}
  // CompareRefs returns the shas, merge base, distance, and change totals between two refs.
  rpc CompareRefs(CompareRefsRequest) returns (CompareRefsResponse) {}
  // ListCompareCommits pages the commits head adds on top of base, oldest first.
  rpc ListCompareCommits(ListCompareCommitsRequest) returns (ListCompareCommitsResponse) {}
  // GetCompareDiff pages the files changed between two refs, hunks excluded.
  rpc GetCompareDiff(GetCompareDiffRequest) returns (GetCompareDiffResponse) {}
  // GetDiffFile returns the hunks of one file between two refs.
  rpc GetDiffFile(GetDiffFileRequest) returns (GetDiffFileResponse) {}
  // Blame attributes each line of a file to a commit.
  rpc Blame(BlameRequest) returns (BlameResponse) {}
  // SearchCode greps one ref of a repository.
  rpc SearchCode(SearchCodeRequest) returns (SearchCodeResponse) {}
  // UpdateFiles commits a batch of file operations to a branch.
  rpc UpdateFiles(UpdateFilesRequest) returns (UpdateFilesResponse) {}
  // RevertCommit commits the inverse of a commit onto a branch.
  rpc RevertCommit(RevertCommitRequest) returns (RevertCommitResponse) {}
  // CherryPickCommit applies a commit onto a branch.
  rpc CherryPickCommit(CherryPickCommitRequest) returns (CherryPickCommitResponse) {}
  // GetArchiveURL returns the download url for a ref archive.
  rpc GetArchiveURL(GetArchiveURLRequest) returns (GetArchiveURLResponse) {}
  // GetTemplates returns issue and pull request templates and codeowners presence.
  rpc GetTemplates(GetTemplatesRequest) returns (GetTemplatesResponse) {}
  // CreateCommitStatus records an external check result on a commit.
  rpc CreateCommitStatus(CreateCommitStatusRequest) returns (CreateCommitStatusResponse) {}
  // ListCommitStatuses returns every status recorded on a commit.
  rpc ListCommitStatuses(ListCommitStatusesRequest) returns (ListCommitStatusesResponse) {}
  // GetCombinedStatus folds the latest status per context into one state.
  rpc GetCombinedStatus(GetCombinedStatusRequest) returns (GetCombinedStatusResponse) {}
}

// Repository units a team or collaborator level applies to
enum GitUnit {
  GIT_UNIT_UNSPECIFIED = 0;
  GIT_UNIT_CODE = 1;
  GIT_UNIT_ISSUES = 2;
  GIT_UNIT_PULLS = 3;
  GIT_UNIT_RELEASES = 4;
  GIT_UNIT_WIKI = 5;
  GIT_UNIT_PROJECTS = 6;
  GIT_UNIT_PACKAGES = 7;
  GIT_UNIT_ACTIONS = 8;
}

// Access level on a unit or on the repository as a whole
enum GitAccessLevel {
  GIT_ACCESS_LEVEL_UNSPECIFIED = 0;
  GIT_ACCESS_LEVEL_NONE = 1;
  GIT_ACCESS_LEVEL_READ = 2;
  GIT_ACCESS_LEVEL_WRITE = 3;
  GIT_ACCESS_LEVEL_ADMIN = 4;
  GIT_ACCESS_LEVEL_OWNER = 5;
}

// How a pull request lands on its base branch
enum GitMergeMethod {
  GIT_MERGE_METHOD_UNSPECIFIED = 0;
  GIT_MERGE_METHOD_MERGE = 1;
  GIT_MERGE_METHOD_SQUASH = 2;
  GIT_MERGE_METHOD_REBASE = 3;
  GIT_MERGE_METHOD_REBASE_MERGE = 4;
  GIT_MERGE_METHOD_FAST_FORWARD = 5;
}

// Which events of a repository reach the caller's notifications
enum WatchMode {
  WATCH_MODE_UNSPECIFIED = 0;
  WATCH_MODE_PARTICIPATING = 1;
  WATCH_MODE_ALL = 2;
  WATCH_MODE_IGNORE = 3;
}

// Outcome of checking a commit or tag signature
enum GitVerificationState {
  GIT_VERIFICATION_STATE_UNSPECIFIED = 0;
  GIT_VERIFICATION_STATE_UNSIGNED = 1;
  GIT_VERIFICATION_STATE_VERIFIED = 2;
  GIT_VERIFICATION_STATE_UNVERIFIED = 3;
  GIT_VERIFICATION_STATE_INSTANCE = 4;
}

// Result of one external or workflow check on a commit
enum CommitStatusState {
  COMMIT_STATUS_STATE_UNSPECIFIED = 0;
  COMMIT_STATUS_STATE_PENDING = 1;
  COMMIT_STATUS_STATE_SUCCESS = 2;
  COMMIT_STATUS_STATE_FAILURE = 3;
  COMMIT_STATUS_STATE_ERROR = 4;
}

// Kind of change a diff file records
enum DiffStatus {
  DIFF_STATUS_UNSPECIFIED = 0;
  DIFF_STATUS_ADDED = 1;
  DIFF_STATUS_MODIFIED = 2;
  DIFF_STATUS_DELETED = 3;
  DIFF_STATUS_RENAMED = 4;
  DIFF_STATUS_COPIED = 5;
  DIFF_STATUS_TYPE_CHANGED = 6;
}

// Kind of one diff line
enum DiffLineKind {
  DIFF_LINE_KIND_UNSPECIFIED = 0;
  DIFF_LINE_KIND_CONTEXT = 1;
  DIFF_LINE_KIND_ADD = 2;
  DIFF_LINE_KIND_DELETE = 3;
}

// Kind of a linked package
enum LinkedRepositoryKind {
  LINKED_REPOSITORY_KIND_UNSPECIFIED = 0;
  LINKED_REPOSITORY_KIND_IMAGE = 1;
  LINKED_REPOSITORY_KIND_ARTIFACT = 2;
}

// Enabled features and external replacements
message GitRepoUnits {
  bool issues = 1;
  bool pulls = 2;
  bool releases = 3;
  bool wiki = 4;
  bool projects = 5;
  bool packages = 6;
  bool actions = 7;
  // Replaces the built in tracker when set
  string external_issues_url = 8;
  // Replaces the built in wiki when set
  string external_wiki_url = 9;
  // Blocked issues cannot close until their blockers close
  bool block_on_dependencies = 10;
  // Manual time entries and time to resolution on issues, off by default
  bool time_tracking = 11;
}

// Allowed merge methods and defaults
message GitMergeSettings {
  bool allow_merge = 1;
  bool allow_squash = 2;
  bool allow_rebase = 3;
  bool allow_rebase_merge = 4;
  bool allow_fast_forward = 5;
  GitMergeMethod default_method = 6;
  bool delete_branch_on_merge = 7;
  bool allow_forks = 8;
}

// Level the caller holds on one unit
message GitUnitLevel {
  GitUnit unit = 1;
  GitAccessLevel level = 2;
}

// Caller's effective access to a repository
message GitViewerAccess {
  repeated GitUnitLevel units = 1;
  // Settings, collaborators, keys, protections, webhooks
  bool can_admin = 2;
  // Delete, transfer, archive
  bool is_owner = 3;
}

// GitRepository is a hosted git repository.
message GitRepository {
  string id = 1;
  string namespace = 2;
  string name = 3;
  string full_name = 4;
  string description = 5;
  string website = 6;
  Visibility visibility = 7;
  string owner_id = 8;
  bool is_org_namespace = 9;
  string default_branch = 10;
  // sha1 or sha256
  string object_format = 11;
  GitRepoType type = 12;
  bool is_archived = 13;
  // Full name of the parent when this is a fork
  string fork_of = 14;
  // Full name of the template this was created from
  string template_of = 15;
  GitRepoUnits units = 16;
  bool lfs_enabled = 17;
  GitMergeSettings merge = 18;
  int64 size_bytes = 19;
  int64 lfs_size_bytes = 20;
  int32 branch_count = 21;
  int32 tag_count = 22;
  int64 pull_count = 23;
  int64 push_count = 24;
  google.protobuf.Timestamp last_pushed_at = 25;
  // Computed from the public hostname or the portal host
  string http_clone_url = 26;
  // Empty when ssh is disabled
  string ssh_clone_url = 27;
  // Present only on mirror repositories, token redacted
  MirrorConfig mirror = 28;
  google.protobuf.Timestamp mirror_last_sync = 29;
  string mirror_last_error = 30;
  google.protobuf.Timestamp mirror_next_attempt = 31;
  bool mirror_syncing = 32;
  // Public half of the generated ssh mirror key, empty when none
  string mirror_ssh_public_key = 33;
  int64 star_count = 34;
  bool is_starred = 35;
  WatchMode watch_mode = 36;
  repeated string topics = 37;
  int64 open_issue_count = 38;
  int64 open_pull_count = 39;
  int32 release_count = 40;
  int32 fork_count = 41;
  // True when the repository has no commits yet
  bool is_empty = 42;
  GitViewerAccess viewer = 43;
  google.protobuf.Timestamp created_at = 44;
  google.protobuf.Timestamp updated_at = 45;
}

// Author or committer identity on a commit
message GitSignature {
  string name = 1;
  string email = 2;
  google.protobuf.Timestamp at = 3;
  // Username of the matching local account, empty when none
  string username = 4;
}

// Signature verification outcome
message GitVerification {
  GitVerificationState state = 1;
  // Human readable reason for an unverified result
  string reason = 2;
  // Username that owns the signing key when verified
  string signer = 3;
  string key_id = 4;
}

// GitCommit is one commit object.
message GitCommit {
  string sha = 1;
  repeated string parents = 2;
  GitSignature author = 3;
  GitSignature committer = 4;
  string message = 5;
  string tree_sha = 6;
  GitVerification verification = 7;
  int32 additions = 8;
  int32 deletions = 9;
  int32 changed_files = 10;
  // Combined state of the latest statuses, unspecified when none
  CommitStatusState status = 11;
}

// GitBranch is one branch with its tip.
message GitBranch {
  string name = 1;
  string sha = 2;
  GitCommit commit = 3;
  bool is_default = 4;
  bool is_protected = 5;
  int32 ahead = 6;
  int32 behind = 7;
}

// GitTag is one tag, annotated or lightweight.
message GitTag {
  string name = 1;
  // Commit the tag points at after peeling
  string sha = 2;
  // Tag object sha for annotated tags, empty for lightweight
  string tag_sha = 3;
  GitSignature tagger = 4;
  string message = 5;
  GitCommit commit = 6;
  bool has_release = 7;
  GitVerification verification = 8;
}

// GitTreeEntry is one row of a directory listing.
message GitTreeEntry {
  string name = 1;
  string path = 2;
  // Octal file mode such as 100644
  string mode = 3;
  // blob, tree, commit for submodules
  string type = 4;
  int64 size = 5;
  string sha = 6;
  // Present only when the request asked for it
  GitCommit last_commit = 7;
  bool is_submodule = 8;
  bool is_lfs = 9;
}

// Pointer metadata for a file stored in lfs
message GitLFSPointer {
  string oid = 1;
  int64 size = 2;
  // Object bytes exist on this server
  bool present = 3;
  string download_url = 4;
}

// GitBlob is one file.
message GitBlob {
  string sha = 1;
  string path = 2;
  string name = 3;
  string mode = 4;
  int64 size = 5;
  bool is_binary = 6;
  // Content omitted because the file exceeds the inline cap
  bool truncated = 7;
  bytes content = 8;
  string content_type = 9;
  bool is_lfs = 10;
  GitLFSPointer lfs = 11;
  string raw_url = 12;
  // Go enry language name, empty when unknown
  string language = 13;
}

// One line of a diff hunk
message DiffLine {
  DiffLineKind kind = 1;
  int32 old_number = 2;
  int32 new_number = 3;
  string text = 4;
}

// One hunk of a file diff
message DiffHunk {
  int32 old_start = 1;
  int32 old_lines = 2;
  int32 new_start = 3;
  int32 new_lines = 4;
  string header = 5;
  repeated DiffLine lines = 6;
}

// One file of a structured diff
message DiffFile {
  string old_path = 1;
  string new_path = 2;
  DiffStatus status = 3;
  string old_mode = 4;
  string new_mode = 5;
  bool is_binary = 6;
  bool is_submodule = 7;
  bool is_lfs = 8;
  int32 additions = 9;
  int32 deletions = 10;
  // Changed lines exceed the per file cap so hunks are never returned
  bool truncated = 11;
  // Present only on single file reads
  repeated DiffHunk hunks = 12;
  string old_sha = 13;
  string new_sha = 14;
}

// One page of a structured diff between two trees, totals cover every matching file
message GitDiff {
  repeated DiffFile files = 1;
  int32 total_files = 2;
  int32 additions = 3;
  int32 deletions = 4;
}

// Run of consecutive lines attributed to one commit
message GitBlameRange {
  int32 start_line = 1;
  int32 end_line = 2;
  GitCommit commit = 3;
  repeated string lines = 4;
}

// One matching line of a code search
message GitGrepMatch {
  string path = 1;
  int32 line_number = 2;
  string line = 3;
}

// GitBranchProtection is one rule over a branch name glob.
message GitBranchProtection {
  string id = 1;
  string pattern = 2;
  int32 priority = 3;
  bool block_force_push = 4;
  bool block_deletion = 5;
  bool require_pull_request = 6;
  int32 required_approvals = 7;
  bool dismiss_stale_approvals = 8;
  bool require_code_owner_review = 9;
  bool require_status_checks = 10;
  repeated string status_check_contexts = 11;
  bool require_signed_commits = 12;
  bool require_linear_history = 13;
  bool require_up_to_date = 14;
  // User and team ids, empty allows every writer
  repeated string allowed_pushers = 15;
  repeated string allowed_mergers = 16;
  repeated string bypass_ids = 17;
}

// GitTagProtection is one rule over a tag name glob.
message GitTagProtection {
  string id = 1;
  string pattern = 2;
  bool block_deletion = 3;
  repeated string allowed_pushers = 4;
}

// GitCollaborator is a user granted a repository level.
message GitCollaborator {
  string user_id = 1;
  string username = 2;
  string display_name = 3;
  GitAccessLevel permission = 4;
  bool accepted = 5;
  google.protobuf.Timestamp created_at = 6;
}

// One image or artifact repository linked to a source repository
message LinkedRepository {
  LinkedRepositoryKind kind = 1;
  string namespace = 2;
  string name = 3;
  string full_name = 4;
  // Latest tag or version, empty when none
  string latest = 5;
  int64 pull_count = 6;
  bool is_private = 7;
  // Linked by the naming rule rather than by hand
  bool linked_by_name = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// Commit totals for one week
message GitActivityWeek {
  google.protobuf.Timestamp week = 1;
  int32 commits = 2;
  int32 additions = 3;
  int32 deletions = 4;
}

// Bytes of one detected language
message GitLanguage {
  string name = 1;
  int64 bytes = 2;
  float percent = 3;
  string color = 4;
}

// Aggregated commits for one author
message GitContributor {
  string username = 1;
  string display_name = 2;
  string email = 3;
  int32 commits = 4;
  int32 additions = 5;
  int32 deletions = 6;
}

// One issue template from the repository tree
message GitIssueTemplate {
  string filename = 1;
  string name = 2;
  string about = 3;
  string title = 4;
  string body = 5;
  repeated string labels = 6;
  repeated string assignees = 7;
  // Body is a yaml form definition
  bool is_form = 8;
}

// Commit status recorded by a check
message GitCommitStatus {
  string id = 1;
  string sha = 2;
  string context = 3;
  CommitStatusState state = 4;
  string target_url = 5;
  string description = 6;
  string creator = 7;
  google.protobuf.Timestamp created_at = 8;
}

// Push mirror configuration and state
message GitPushMirror {
  string id = 1;
  string remote_url = 2;
  bool has_token = 3;
  bool use_ssh_key = 4;
  int32 interval_minutes = 5;
  bool sync_on_push = 6;
  google.protobuf.Timestamp last_sync = 7;
  string last_error = 8;
  bool syncing = 9;
}

// Pending transfer of a repository to a user
message GitTransfer {
  string id = 1;
  string repo_id = 2;
  string full_name = 3;
  string to_namespace = 4;
  string requested_by = 5;
  google.protobuf.Timestamp expires_at = 6;
  google.protobuf.Timestamp created_at = 7;
}

// CreateGitRepositoryRequest describes a repository to create.
message CreateGitRepositoryRequest {
  // Empty defaults to the caller
  string namespace = 1;
  string name = 2;
  string description = 3;
  Visibility visibility = 4;
  // Empty takes the effective default branch setting
  string default_branch = 5;
  // sha1 or sha256, empty means sha1
  string object_format = 6;
  // Unspecified defaults to standard
  GitRepoType type = 7;
  // Required for mirror type
  MirrorConfig mirror = 8;
  // Create an initial commit with a readme
  bool auto_init = 9;
  // Gitignore template name, requires auto_init
  string gitignore_template = 10;
  // License identifier such as MIT, requires auto_init
  string license = 11;
  // Also create a linked release mirror package for mirror type
  bool mirror_releases = 12;
  // Also create linked image mirrors for mirror type
  repeated string mirror_images = 13;
  // Import issues, pulls, labels, and milestones for mirror type
  bool import_metadata = 14;
  string website = 15;
  repeated string topics = 16;
}

// CreateGitRepositoryResponse contains the created repository.
message CreateGitRepositoryResponse {
  GitRepository repository = 1;
}

// GetGitRepositoryRequest identifies a repository.
message GetGitRepositoryRequest {
  string namespace = 1;
  string name = 2;
}

// GetGitRepositoryResponse contains the repository.
message GetGitRepositoryResponse {
  GitRepository repository = 1;
}

// ListGitRepositoriesRequest filters and pages repositories.
message ListGitRepositoriesRequest {
  // page.query filters on name, namespace, description. page.order_by accepts name, updated_at, stars, created_at
  PageRequest page = 1;
  string namespace = 2;
  GitRepoType type = 3;
  string topic = 4;
  // Include archived repositories
  bool include_archived = 5;
  // Only forks or only non forks when set
  optional bool forks = 6;
}

// ListGitRepositoriesResponse contains a page of repositories.
