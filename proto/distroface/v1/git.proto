// GetTreeRequest lists a directory.
message GetTreeRequest {
  string namespace = 1;
  string name = 2;
  // Branch, tag, or sha, empty uses the default branch
  string ref = 3;
  // Directory path, empty for the root
  string path = 4;
  // Walk the whole subtree
  bool recursive = 5;
  // Resolve the last commit touching each entry
  bool with_last_commit = 6;
}

// GetTreeResponse contains the listing.
message GetTreeResponse {
  // Resolved commit the listing was read from
  string sha = 1;
  string path = 2;
  repeated GitTreeEntry entries = 3;
  // Last commit touching the directory itself
  GitCommit last_commit = 4;
}

// GetBlobRequest reads a file.
message GetBlobRequest {
  string namespace = 1;
  string name = 2;
  string ref = 3;
  string path = 4;
}

// GetBlobResponse contains the file.
message GetBlobResponse {
  string sha = 1;
  GitBlob blob = 2;
  GitCommit last_commit = 3;
}

// GetReadmeRequest finds a readme.
message GetReadmeRequest {
  string namespace = 1;
  string name = 2;
  string ref = 3;
  string path = 4;
}

// GetReadmeResponse contains the readme or nothing.
message GetReadmeResponse {
  GitBlob blob = 1;
}

// ListCommitsRequest pages history.
message ListCommitsRequest {
  // page.page_token carries the cursor sha, total_count is not computed
  PageRequest page = 1;
  string namespace = 2;
  string name = 3;
  string ref = 4;
  // Only commits touching this path
  string path = 5;
  // Author name or email substring
  string author = 6;
  google.protobuf.Timestamp since = 7;
  google.protobuf.Timestamp until = 8;
}

// ListCommitsResponse contains a page of commits.
message ListCommitsResponse {
  repeated GitCommit commits = 1;
  PageInfo page = 2;
}

// GetCommitRequest identifies a commit.
message GetCommitRequest {
  string namespace = 1;
  string name = 2;
  string sha = 3;
}

// GetCommitResponse contains the commit and its statuses.
message GetCommitResponse {
  GitCommit commit = 1;
  repeated GitCommitStatus statuses = 2;
  // Branches whose tip is this commit
  repeated string branches = 3;
  // Tags pointing at this commit
  repeated string tags = 4;
}

// GetCommitDiffRequest pages the files of one commit.
message GetCommitDiffRequest {
  // page.query.text keeps only paths containing it
  PageRequest page = 1;
  string namespace = 2;
  string name = 3;
  string sha = 4;
  // Zero based parent index for merge commits
  int32 parent = 5;
}

// GetCommitDiffResponse contains a page of changed files.
message GetCommitDiffResponse {
  GitDiff diff = 1;
  PageInfo page = 2;
  // Parent the files were diffed against, empty for a root commit
  string base_sha = 3;
}

// CompareRefsRequest compares two refs, head may prefix the ref with another repository.
message CompareRefsRequest {
  string namespace = 1;
  string name = 2;
  string base = 3;
  string head = 4;
}

// CompareRefsResponse contains the resolved shas and change totals.
message CompareRefsResponse {
  string base_sha = 1;
  string head_sha = 2;
  string merge_base_sha = 3;
  // Commits head adds on top of base
  int32 ahead = 4;
  int32 behind = 5;
  int32 changed_files = 6;
  int32 additions = 7;
  int32 deletions = 8;
}

// ListCompareCommitsRequest pages the commits between two refs.
message ListCompareCommitsRequest {
  PageRequest page = 1;
  string namespace = 2;
  string name = 3;
  string base = 4;
  string head = 5;
}

// ListCompareCommitsResponse contains commits oldest first.
message ListCompareCommitsResponse {
  repeated GitCommit commits = 1;
  PageInfo page = 2;
}

// GetCompareDiffRequest pages the files changed between two refs.
message GetCompareDiffRequest {
  // page.query.text keeps only paths containing it
  PageRequest page = 1;
  string namespace = 2;
  string name = 3;
  string base = 4;
  string head = 5;
}

// GetCompareDiffResponse contains a page of changed files.
message GetCompareDiffResponse {
  GitDiff diff = 1;
  PageInfo page = 2;
  // Tree the files were diffed from, the merge base when one exists
  string base_sha = 3;
  string head_sha = 4;
}

// GetDiffFileRequest reads the hunks of one file, base empty diffs head against its first parent.
message GetDiffFileRequest {
  string namespace = 1;
  string name = 2;
  string base = 3;
  string head = 4;
  string path = 5;
}

// GetDiffFileResponse contains the file diff.
message GetDiffFileResponse {
  DiffFile file = 1;
}

// BlameRequest attributes a file.
message BlameRequest {
  string namespace = 1;
  string name = 2;
  string ref = 3;
  string path = 4;
}

// BlameResponse contains runs of lines by commit.
message BlameResponse {
  string sha = 1;
  repeated GitBlameRange ranges = 2;
}

// SearchCodeRequest greps one ref.
message SearchCodeRequest {
  PageRequest page = 1;
  string namespace = 2;
  string name = 3;
  string ref = 4;
  // Regular expression
  string pattern = 5;
  // Path glob such as src/**/*.go
  string path_glob = 6;
  bool case_insensitive = 7;
}

// SearchCodeResponse contains matching lines.
message SearchCodeResponse {
  string sha = 1;
  repeated GitGrepMatch matches = 2;
  PageInfo page = 3;
}

// What to do with one path in an UpdateFiles commit
enum FileOperationKind {
  FILE_OPERATION_KIND_UNSPECIFIED = 0;
  FILE_OPERATION_KIND_CREATE = 1;
  FILE_OPERATION_KIND_UPDATE = 2;
  FILE_OPERATION_KIND_DELETE = 3;
  FILE_OPERATION_KIND_RENAME = 4;
}

// One file operation
message FileOperation {
  FileOperationKind kind = 1;
  string path = 2;
  // Source path for rename
  string from_path = 3;
  bytes content = 4;
  // Executable bit for create and update
  bool executable = 5;
}

// UpdateFilesRequest commits a batch of operations.
message UpdateFilesRequest {
  string namespace = 1;
  string name = 2;
  string branch = 3;
  // Commit to this new branch instead, created from branch
  string new_branch = 4;
  string message = 5;
  repeated FileOperation operations = 6;
  // Refused when the branch moved past this sha
  string expected_head_sha = 7;
}

// UpdateFilesResponse contains the new commit.
message UpdateFilesResponse {
  GitCommit commit = 1;
  string branch = 2;
}

// RevertCommitRequest reverts a commit onto a branch.
message RevertCommitRequest {
  string namespace = 1;
  string name = 2;
  string sha = 3;
  string branch = 4;
  string new_branch = 5;
}

// RevertCommitResponse contains the new commit.
message RevertCommitResponse {
